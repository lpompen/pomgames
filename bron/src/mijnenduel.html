<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mijnenduel">
<meta name="theme-color" content="#150F26">
<title>Mijnenduel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EFEAF8;--ink:#1D1533;--muted:#62558A;--panel:#FFFFFF;--line:#D8CFEB;--scrim:rgba(29,21,51,.55);
  --well:#1D1533;--rev:#140E26;--t1:#6E5CB0;--t2:#6553A6;--mine:#A89CD0;
  --p0:#FF6B5B;--p1:#4FB3FF;--p0s:rgba(255,107,91,.3);--p1s:rgba(79,179,255,.3);--boom:#FF9447;
  --n1:#7CC4FF;--n2:#5EE0A0;--n3:#FF8A7A;--n4:#C79BFF;--n5:#FFC23D;--n6:#4FE3E0;--n7:#FF7AC6;--n8:#EDE8FA;
  --font:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bungee','Arial Black',system-ui,sans-serif;
  --n:12;--cs:26px;--gap:3px;--pad:6px;--bs:330px;--glow:transparent;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150F26;--ink:#F2EDFF;--muted:#A597C8;--panel:#221A3A;--line:#3A2E58;--scrim:rgba(8,5,16,.72);--well:#0D0919;--rev:#191232;}}
:root[data-theme="dark"]{--bg:#150F26;--ink:#F2EDFF;--muted:#A597C8;--panel:#221A3A;--line:#3A2E58;--scrim:rgba(8,5,16,.72);--well:#0D0919;--rev:#191232;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--p1);outline-offset:2px}

#app{height:100%;max-width:640px;margin:0 auto;padding:4px 10px 8px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
#app.nudge{animation:nudge .6s linear}
@keyframes nudge{0%,100%{transform:none}10%,50%,90%{transform:translate(-9px,3px) rotate(-1deg)}30%,70%{transform:translate(9px,-3px) rotate(1deg)}}
#top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:54px}
#mode{font-family:var(--display);font-size:14px;line-height:1.1;color:var(--muted)}
#mid{text-align:center;min-width:110px}
#left{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
#sub{font-size:12px;font-weight:500;color:var(--muted);margin-top:3px;min-height:15px;white-space:nowrap}
.iconbtn{justify-self:end;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.iconbtn svg{width:20px;height:20px}

#players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 8px}
.pl{--pc:var(--p0);--pcs:var(--p0s);display:flex;align-items:center;gap:6px;min-width:0;padding:6px 7px 6px 10px;border-radius:16px;background:var(--panel);border:2px solid var(--line);transition:border-color .2s,box-shadow .2s}
#pl1{--pc:var(--p1);--pcs:var(--p1s);flex-direction:row-reverse;text-align:right;padding:6px 10px 6px 7px}
.pl.on{border-color:var(--pc);box-shadow:0 0 0 4px var(--pcs)}
.pn{flex:1;min-width:0}
.nm{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
.pl.on .st{color:var(--ink)}
.sc{flex:none;display:grid;place-items:center;min-width:42px;height:38px;padding:0 8px;border-radius:11px;background:var(--pc);color:#1D1533;
  font-family:var(--display);font-size:20px;line-height:1;font-variant-numeric:tabular-nums;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.bm{flex:none;display:grid;place-items:center;width:20px;height:20px;color:var(--muted);opacity:.55}
.bm svg{width:18px;height:18px}
.bm.ready{color:var(--boom);opacity:1}
.bm.used{opacity:.18}

#boardWrap{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#board{position:relative;width:var(--bs);height:var(--bs);padding:var(--pad);display:grid;
  grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));gap:var(--gap);
  background:var(--well);border-radius:14px;box-shadow:0 0 0 3px var(--glow),0 12px 30px rgba(20,10,40,.28);transition:box-shadow .25s;touch-action:manipulation}
#board.shake{animation:shake .45s ease-out}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(2px,2px)}}
.cell{position:relative;border-radius:24%;display:grid;place-items:center;font-family:var(--display);font-size:calc(var(--cs)*.58);line-height:1;min-width:0;min-height:0}
.cell.h{background:var(--t1);cursor:pointer;
  box-shadow:inset 0 calc(var(--cs)*-.1) 0 rgba(0,0,0,.26),inset 0 calc(var(--cs)*.08) 0 rgba(255,255,255,.22)}
.cell.h.a{background:var(--t2)}
.cell.h:active{transform:scale(.88)}
@media (hover:hover){.cell.h:hover{filter:brightness(1.2)}}
.cell.r{background:var(--rev)}
.cell.n1{color:var(--n1)}.cell.n2{color:var(--n2)}.cell.n3{color:var(--n3)}.cell.n4{color:var(--n4)}
.cell.n5{color:var(--n5)}.cell.n6{color:var(--n6)}.cell.n7{color:var(--n7)}.cell.n8{color:var(--n8)}
.cell.f0,.cell.f1{box-shadow:inset 0 calc(var(--cs)*-.1) 0 rgba(0,0,0,.22),inset 0 calc(var(--cs)*.08) 0 rgba(255,255,255,.35)}
.cell.f0{background:var(--p0)}.cell.f1{background:var(--p1)}
.cell.m{color:var(--mine)}
.cell svg{width:74%;height:74%;display:block}
.cell.last::after{content:"";position:absolute;inset:-2px;border-radius:30%;border:2px solid #fff;opacity:.9;pointer-events:none}
.cell.bp::before{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(255,148,71,.5);pointer-events:none}
.cell.bpc::before{background:rgba(255,148,71,.95)}
.cell.in{animation:open .34s ease-out both}
.cell.pop{animation:claim .5s cubic-bezier(.3,1.7,.5,1) both}
@keyframes open{0%{transform:scale(.55);opacity:.15}100%{transform:scale(1);opacity:1}}
@keyframes claim{0%{transform:scale(.2) rotate(-25deg)}100%{transform:scale(1)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:2}
.fxt{position:absolute;font-family:var(--display);color:#fff;font-size:22px;line-height:1;white-space:nowrap;
  text-shadow:0 2px 0 rgba(0,0,0,.45);animation:rise 1s ease-out both}
.fxb{position:absolute;border-radius:50%;border:4px solid var(--boom);animation:boom .6s ease-out both}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-190%)}}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}

#bar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;min-height:64px;padding-top:8px}
#status{font-size:15px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tool{min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--panel);padding:0 14px;font-weight:700;font-size:15px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tool svg{width:18px;height:18px}
.tool[hidden]{display:none}
.tool[aria-disabled="true"]{opacity:.42}
#bombBtn.ready{background:var(--boom);border-color:var(--boom);color:#1D1533;box-shadow:inset 0 -4px 0 rgba(0,0,0,.16)}
#bombBtn.armed{background:var(--ink);border-color:var(--ink);color:var(--bg)}

#toast{position:absolute;left:50%;top:6px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;z-index:45;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:500;font-size:15px;max-width:88vw;text-align:center;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}

#ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:var(--scrim);
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);touch-action:manipulation}
#ov.on{display:flex}
.panel{width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--panel);color:var(--ink);border-radius:24px;padding:22px 20px 18px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.panel h2{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.15;margin:0 0 6px}
.panel p{margin:6px 0;line-height:1.45}
.title{display:grid;gap:5px;margin:2px 0 10px}
.title div{display:flex;justify-content:center;gap:5px}
.title span{display:grid;place-items:center;width:38px;height:40px;border-radius:10px;font-family:var(--display);font-size:21px;color:#fff;background:var(--t1);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.24),inset 0 3px 0 rgba(255,255,255,.25)}
.title span.o{background:#140E26;box-shadow:none}
.title span.o1{color:var(--n1)}.title span.o2{color:var(--n2)}.title span.o3{color:var(--n3)}.title span.o4{color:var(--n4)}.title span.o5{color:var(--n5)}
.title span.fa{background:var(--p0)}.title span.fb{background:var(--p1)}
.title svg{width:26px;height:26px}
.tag{text-align:center;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--bg);margin:12px 0 4px}
.seg button{border:0;border-radius:12px;background:transparent;padding:7px 4px;min-height:52px;text-align:center}
.seg b{display:block;font-size:15px}
.seg span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.seg button[aria-checked="true"]{background:var(--panel);box-shadow:0 2px 8px rgba(29,21,51,.18)}
.btn{display:block;width:100%;min-height:52px;border-radius:15px;border:0;font-weight:700;font-size:17px;margin-top:10px;padding:0 14px}
.btn.pri{background:var(--t1);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22)}
.btn.sec{background:transparent;border:2px solid var(--line)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500;min-height:44px}
.btn:active,.mode:active{transform:translateY(1px)}
.mode{display:block;width:100%;text-align:left;border:2px solid var(--line);background:transparent;border-radius:16px;padding:13px 15px;margin-top:10px}
.mode b{display:block;font-family:var(--display);font-weight:400;font-size:18px;margin-bottom:3px}
.mode span{display:block;color:var(--muted);font-size:14px;line-height:1.4}
div.mode{cursor:default}
.lab{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:12px}
.field{display:block;width:100%;min-height:50px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--ink);
  font:500 17px var(--font);padding:0 14px;margin-top:6px;-webkit-user-select:text;user-select:text}
.field.code{font-family:var(--display);font-size:26px;letter-spacing:.25em;text-align:center;text-transform:uppercase}
.or{text-align:center;color:var(--muted);font-size:14px;margin:18px 0 0}
.bigcode{font-family:var(--display);font-size:54px;letter-spacing:.14em;text-align:center;margin:6px 0 2px;-webkit-user-select:text;user-select:text}
.status{font-weight:500}
.status.wait::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--n2);margin-left:8px;vertical-align:1px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.fine{font-size:13px;color:var(--muted)}
.rows{margin:10px 0 4px;border-top:1px solid var(--line)}
.rows div{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px}
.rows b{font-family:var(--display);font-weight:400;font-size:20px}
.rows i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.rules p b{font-weight:700}
textarea.field{min-height:220px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace}
@media (prefers-reduced-motion:reduce){.cell.in,.cell.pop,.fxt,.fxb,#board.shake,#app.nudge{animation-duration:.01s!important;animation-delay:0s!important}.status.wait::after{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="mode">Mijnenduel</div>
    <div id="mid"><div id="left">29</div><div id="sub"></div></div>
    <button class="iconbtn" data-a="menu" aria-label="Menu"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="2" y="4" width="16" height="2.4" rx="1.2"/><rect x="2" y="9" width="16" height="2.4" rx="1.2"/><rect x="2" y="14" width="16" height="2.4" rx="1.2"/></svg></button>
  </header>
  <section id="players" style="visibility:hidden">
    <div class="pl" id="pl0"><div class="pn"><b class="nm"></b><span class="st"></span></div><span class="bm"></span><span class="sc">0</span></div>
    <div class="pl" id="pl1"><div class="pn"><b class="nm"></b><span class="st"></span></div><span class="bm"></span><span class="sc">0</span></div>
  </section>
  <main id="boardWrap"><div id="board" aria-label="Mijnenveld"><div id="fx"></div></div><div id="toast" role="status" aria-live="polite"></div></main>
  <footer id="bar">
    <div id="status" aria-live="polite"></div>
    <button class="tool" id="nudgeBtn" data-a="nudge" hidden>Por</button>
    <button class="tool" id="bombBtn" data-a="bomb" aria-disabled="true"></button>
  </footer>
</div>
<div id="ov" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>

<script>
(() => {
'use strict';
const VERSION = '1.0.0';
const APP = 'md1';
const PEER_PREFIX = 'mijnenduel-v1-';
const $ = s => document.querySelector(s);
const T0 = performance.now();
const params = new URLSearchParams(location.search);
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
const FORCE_BC = params.get('net') === 'bc';
const ls = {
  get(k, d) { try { const v = localStorage.getItem('mijnenduel.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mijnenduel.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('mijnenduel.' + k); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hex = i => i.toString(16).padStart(2, '0');
const pick = a => a[Math.floor(Math.random() * a.length)];

const FLAG = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 3.5v13" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M7.6 3.8 15.6 7.1 7.6 10.4z" fill="#fff"/></svg>';
const MINE = '<svg viewBox="0 0 20 20" aria-hidden="true"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 2.6v14.8M2.6 10h14.8M4.8 4.8l10.4 10.4M15.2 4.8 4.8 15.2"/></g><circle cx="10" cy="10" r="5" fill="currentColor"/><circle cx="8.3" cy="8.3" r="1.4" fill="#fff" opacity=".6"/></svg>';
const BOMB = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.6" cy="12" r="6" fill="currentColor"/><path d="M12.6 7.6l2.2-2.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="16.2" cy="4" r="1.6" fill="currentColor"/></svg>';

/* ---------------- LOG van de laatste run ---------------- */
const Log = (() => {
  const d = { run: Math.random().toString(36).slice(2, 8), version: VERSION, started: new Date().toISOString(),
    env: FORCE_BC ? 'test-broadcast' : IN_CLAUDE ? 'claude-artifact' : 'web', ua: navigator.userAgent.slice(0, 180),
    screen: `${screen.width}x${screen.height} dpr${window.devicePixelRatio || 1} venster${innerWidth}x${innerHeight}`, errors: 0, entries: [] };
  let dirty = true, db = null, uid = null, busy = false;
  function add(kind, msg) {
    const t = ((performance.now() - T0) / 1000).toFixed(1).padStart(6, ' ');
    d.entries.push(`${t}s ${kind.padEnd(4)} ${String(msg).replace(/[\u0000-\u001f\u007f]/g, ' ').slice(0, 240)}`);
    if (d.entries.length > 500) d.entries.splice(0, d.entries.length - 500);
    if (kind === 'err') { d.errors++; setTimeout(flush, 100); }
    dirty = true;
  }
  async function flush() {
    if (!dirty) return;
    dirty = false; d.saved = new Date().toISOString();
    ls.set('lastlog', d);
    if (db && uid && !busy) {
      busy = true;
      try { await db.doc(`data/users/${uid}/runlog`).set(JSON.parse(JSON.stringify(d))); }
      catch (e) { const c = e && e.code; if (c === 'invalid_argument' || c === 'revoked' || c === 'not_granted') { db = null; add('info', 'online log-opslag uit: ' + c); } else dirty = true; }
      busy = false;
    }
  }
  const text = () => [`Mijnenduel log  run=${d.run}  v${d.version}  omgeving=${d.env}`, `start ${d.started}`, `toestel ${d.ua}`, `scherm ${d.screen}`, `fouten ${d.errors}`, '', ...d.entries].join('\n');
  setInterval(flush, 3000);
  document.addEventListener('visibilitychange', () => { add('info', document.visibilityState === 'hidden' ? 'app naar achtergrond' : 'app weer zichtbaar'); if (document.visibilityState === 'hidden') flush(); });
  addEventListener('pagehide', () => { dirty = true; flush(); });
  return { add, flush, text, attach(ns, id) { db = ns; uid = id; dirty = true; flush(); } };
})();
addEventListener('error', e => Log.add('err', `${e.message || 'fout'} @${String(e.filename || '').split('/').pop()}:${e.lineno || 0}`));
addEventListener('unhandledrejection', e => { const r = e.reason; Log.add('err', 'promise: ' + (r ? (r.code ? r.code + ' ' : '') + (r.message || r.type || String(r)) : '?')); });
Log.add('info', `start v${VERSION} omgeving=${FORCE_BC ? 'test' : IN_CLAUDE ? 'claude' : 'web'}`);

let roomP = Promise.resolve(null);
if (IN_CLAUDE && !FORCE_BC) {
  roomP = window.claude.use('room').catch(() => null);
  roomP.then(r => Log.add('net', 'realtime kamer ' + (r ? 'beschikbaar' : 'niet beschikbaar')));
  (async () => {
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) { Log.add('info', 'db/user niet beschikbaar: log alleen lokaal'); return; }
      const id = await user.id();
      if (!id) { Log.add('info', 'geen gebruikers-id: log alleen lokaal'); return; }
      try {
        const prev = await db.doc(`data/users/${id}/runlog`).get();
        if (prev.exists) await db.doc(`data/users/${id}/runlog_prev`).set(JSON.parse(JSON.stringify(prev.data())));
      } catch (e) { Log.add('info', 'vorige log niet bewaard: ' + (e && e.code)); }
      Log.attach(db, id); Log.add('info', 'log wordt online bewaard');
    } catch (e) { Log.add('err', 'log-opslag: ' + (e && (e.code || e.message))); }
  })();
}

/* ---------------- ENGINE ---------------- */
class RNG {
  constructor(s) { this.a = s >>> 0; }
  next() { let t = (this.a = (this.a + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
}
const SIZES = {
  compact: { n: 12, m: 29, label: 'Compact' },
  klassiek: { n: 16, m: 51, label: 'Klassiek' }
};
const MVRE = /^([cb][0-9a-f]{2})*$/;
function makeField(seed, size) {
  const S = SIZES[size] || SIZES.compact, n = S.n, N2 = n * n;
  const R = new RNG((seed ^ 0x6D1E) >>> 0);
  const idx = Array.from({ length: N2 }, (_, i) => i);
  for (let i = N2 - 1; i > 0; i--) { const j = Math.floor(R.next() * (i + 1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }

const Net = {
  role: null, code: '', t: null, connected: false, opp: null, oppSeen: 0, rtt: 0, rttN: 0, measured: 0, lostAt: 0,

  },
  set(p) {

  found() { if (this.connected) return; this.connected = true; this.lostAt = 0; Log.add('net', 'verbonden met ' + oppNick()); onNetUp(); },
  lost(why) { if (!this.connected) return; this.connected = false; this.lostAt = Date.now(); Log.add('net', 'verbinding weg: ' + why); onNetDown(why); },

async function roomTransport(role, code) {
  const room = await roomP;
  if (!room) throw Object.assign(new Error('Realtime kamer niet beschikbaar'), { type: 'room-null' });
  let oppPeer = null, lastP = null;
  const offPeers = room.onPeers(ch => {
    let best = null;
    for (const p of ch.peers) {
      const pr = p.presence;
      if (p.sameTab || !pr || pr.app !== APP || pr.code !== code || pr.role === role) continue;
      if (!best || p.updatedAt > best.updatedAt) best = p;
    }
    if (!best) { if (oppPeer) { oppPeer = null; lastP = null; Net.lost('ander heeft de pagina verlaten'); } return; }
    if (best.peer !== oppPeer) { oppPeer = best.peer; lastP = null; }
    if (best.presence !== lastP) { lastP = best.presence; Net.receive(best.presence); }
  }, err => { Log.add('err', 'kamer: ' + err.code); Net.lost('kamer ' + err.code); });
  const offConn = room.onConnection(c => Log.add('net', 'kamer ' + (c ? 'online' : 'offline')), () => {});
  return {
    send(o) { room.presence(o).catch(e => Log.add('err', 'presence: ' + (e && e.code) + ' ' + (e && e.message))); },
    close(keys) { offPeers(); offConn(); const clear = {}; for (const k of keys) clear[k] = null; room.presence(clear).catch(() => {}); }
  };
}

  return new Promise((resolve, reject) => {
    let conn = null, done = false;
    const peer = role === 'h' ? new window.Peer(PEER_PREFIX + code, { debug: 1 }) : new window.Peer({ debug: 1 });
    const t = {
      send(o) { if (conn && conn.open) conn.send(o); },
      close() { try { if (conn) conn.close(); } catch (e) {} try { peer.destroy(); } catch (e) {} }
    };

    <button class="btn ghost" data-a="home">Stoppen</button>`, 'lobby');
  updateLobby();
}
function updateLobby() {
  const n = $('#oppN'); if (n) n.textContent = oppNick();
  const r = $('#rtt'); if (r && Net.rtt) r.textContent = `Reactietijd ${Net.rtt} ms${Net.rtt < 120 ? ', lekker snel' : Net.rtt < 300 ? ', prima' : ', wat traag'}`;
  if (Net.role === 'g') setStatus(`${oppNick()} kiest het bord`);
}
function showResult(r) {
  lastResult = r;
  let title, rows = '', btns = '';
  const row = (p, label, sc) => `<div><span><i style="background:var(--p${p})"></i>${esc(label)}</span><b>${sc}</b></div>`;
  if (r.gone) title = 'Verbinding verbroken';
  else if (r.kind === 'local') { title = `${r.names[r.winner]} wint!`; sfx.win(); }
  else { const win = r.winner === r.me; title = win ? 'Jij wint!' : `${r.names[r.winner]} wint`; win ? sfx.win() : sfx.lose(); }
  if (r.score) rows = row(0, r.names ? r.names[0] : 'Speler 1', r.score[0]) + row(1, r.names ? r.names[1] : 'Speler 2', r.score[1]);
  const view = '<button class="btn ghost" data-a="view">Bekijk het veld</button>';
  if (r.kind === 'bot') {
    const rec = ls.get('rec', { w: 0, l: 0 });
    btns = `<button class="btn pri" data-a="botgo" data-level="${r.level}">Nog een keer</button>${view}<button class="btn ghost" data-a="home">Naar start</button>
      <p class="fine" style="text-align:center">Tegen de computer: ${rec.w} gewonnen, ${rec.l} verloren</p>`;
  } else if (r.kind === 'local') btns = `<button class="btn pri" data-a="localnext" data-size="${r.size}">Nog een keer</button>${view}<button class="btn ghost" data-a="home">Naar start</button>`;
  else if (r.gone || !Net.connected) btns = '<button class="btn pri" data-a="online">Nieuw online spel</button><button class="btn ghost" data-a="home">Naar start</button>';
  else if (Net.role === 'h') btns = `<button class="btn pri" data-a="start" data-size="${r.size}">Nog een keer</button><button class="btn sec" data-a="lobby">Ander bord</button>${view}<button class="btn ghost" data-a="home">Stoppen</button>`;
  else btns = `<p class="status wait" id="netStatus">Wachten tot ${esc(oppNick())} een nieuw spel start</p>${view}<button class="btn ghost" data-a="home">Stoppen</button>`;
  openOv(`<h2>${esc(title)}</h2><div class="rows">${rows}</div>${btns}`, 'result');
}
function showMenu() {
  const online = !!Net.role, over = G && G.over();
  openOv(`<h2>Menu</h2>
    ${over && lastResult ? '<button class="btn pri" data-a="result">Uitslag bekijken</button>' : '<button class="btn pri" data-a="resume">Verder spelen</button>'}
    ${G && G.kind === 'bot' ? '<button class="btn sec" data-a="bot">Nieuw spel tegen de computer</button>' : ''}
    ${G && G.kind === 'local' ? '<button class="btn sec" data-a="localnext">Nieuw spel samen</button>' : ''}
    <button class="btn sec" data-a="rulesm">Hoe werkt het?</button>
    <button class="btn sec" data-a="sound">Geluid: ${soundOn ? 'aan' : 'uit'}</button>
    <button class="btn sec" data-a="copylog">Kopieer log</button>
    <button class="btn ghost" data-a="home">${online ? 'Stoppen en naar start' : 'Naar start'}</button>
    <p class="fine" style="margin-top:12px">${IN_CLAUDE ? 'Tip: zeg "log" tegen Claude, dan leest die de log van deze run.' : 'Tip: plak de log in je chat met Claude als er iets misgaat.'} Versie ${VERSION}.</p>`, 'menu');
}
async function copyLog() {
  await Log.flush();
  const txt = Log.text();
  try { await navigator.clipboard.writeText(txt); toast('Log gekopieerd'); }
  catch (e) { openOv(`<h2>Log</h2><p class="fine">Selecteer alles en kopieer.</p><textarea class="field" readonly>${esc(txt)}</textarea><button class="btn ghost" data-a="menu">Terug</button>`, 'menu'); }
}

const ACT = {
  cont: () => { const s = ls.get('bot', null); if (s && SIZES[s.size] && Array.isArray(s.mv)) startBot(s.level, s); else showBotPick(); },
  bot: () => showBotPick(),
  botgo: el => startBot(el.dataset.level),
  local: () => startLocal(),
  localnext: el => startLocal(el && SIZES[el.dataset.size] ? el.dataset.size : (G && G.F.size)),
  online: () => showOnline(),
  home: () => showHome(),
  rules: () => showRules(),
  rulesm: () => { showRules(); panelEl.querySelector('[data-a="home"]').dataset.a = 'menu'; },
  size: el => { ls.set('size', el.dataset.size); showHome(); },
  host: el => goOnline('h', cleanCode(el && el.dataset.code).length === 4 ? cleanCode(el.dataset.code) : newCode()),
  join: () => { const c = cleanCode($('#code') && $('#code').value); if (c.length !== 4) { toast('Vul de 4 letters van de code in'); return; } goOnline('g', c); },
  rejoin: el => goOnline('g', el.dataset.code),
  start: el => { if (Net.role === 'h' && Net.connected) hostStart(el.dataset.size); },
  lobby: () => { stopGame(); renderAll(); showLobby(); },
  menu: () => showMenu(),
  resume: () => { if (G) { closeOv(); ui = 'game'; } else showHome(); },
  result: () => { if (lastResult) showResult(lastResult); },
  view: () => { closeOv(); ui = 'game'; },
  sound: () => { soundOn = !soundOn; ls.set('sound', soundOn); if (soundOn) sfx.turn(); showMenu(); },
  copylog: () => copyLog(),
  bomb: () => { if (G) { G.toggleBomb(); renderAll(); } },
  nudge: () => sendNudge(),
  share: async () => {
    const url = location.origin + location.pathname + '?join=' + Net.code;
    const text = `Speel Mijnenduel tegen me! Code: ${Net.code}`;
    try { if (navigator.share) { await navigator.share({ title: 'Mijnenduel', text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text + ' ' + url); toast('Uitnodiging gekopieerd'); } catch (e) { toast('Code: ' + Net.code); }
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = ACT[el.dataset.a]; if (f) { audio(); f(el); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && G && G.bombState() === 'armed') { G.toggleBomb(); renderAll(); return; }
  if (e.key !== 'Enter') return;
  if (e.target.id === 'code') ACT.join(); else if (e.target.id === 'nick' && ui === 'online') e.target.blur();
});
document.addEventListener('input', e => { if (e.target.id === 'code') { const v = cleanCode(e.target.value); if (v !== e.target.value) e.target.value = v; } });

setInterval(() => { if (G && G.tick) G.tick(); if (G) { renderHud(); renderPlayers(); } }, 250);

/* ---------------- START ---------------- */
buildBoard(SIZES[curSize()].n); renderAll();
Log.add('info', `venster ${innerWidth}x${innerHeight}, vakje ${geo.cs}px`);
const joinCode = cleanCode(params.get('join'));
if (joinCode.length === 4) { showOnline(joinCode); if (ls.get('nick', '')) setTimeout(() => goOnline('g', joinCode), 150); }
else showHome();

if (params.has('test')) window.__md = { get G() { return G; }, Net, SIZES, makeField, replay, botMove, analyze, Log, get ui() { return ui; } };
})();
</script>
</body>
</html>
