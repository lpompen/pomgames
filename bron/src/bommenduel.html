<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bommenduel">
<meta name="theme-color" content="#150F26">
<title>Bommenduel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EFEAF8;--ink:#1D1533;--muted:#62558A;--panel:#FFFFFF;--line:#D8CFEB;--scrim:rgba(29,21,51,.55);
  --well:#1D1533;--slot:#2C2349;
  --k1:#FF6B5B;--k2:#FFC23D;--k3:#3DDC97;--k4:#4FB3FF;--k5:#B48CFF;--k6:#FF7AC6;--k7:#FF9447;
  --font:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bungee','Arial Black',system-ui,sans-serif;
  --ph:150px;--glow:transparent;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150F26;--ink:#F2EDFF;--muted:#A597C8;--panel:#221A3A;--line:#3A2E58;--scrim:rgba(8,5,16,.72);--well:#0D0919;--slot:#241C3E;}}
:root[data-theme="dark"]{--bg:#150F26;--ink:#F2EDFF;--muted:#A597C8;--panel:#221A3A;--line:#3A2E58;--scrim:rgba(8,5,16,.72);--well:#0D0919;--slot:#241C3E;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--k4);outline-offset:2px}

#app{height:100%;max-width:560px;margin:0 auto;padding:4px 12px 8px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;touch-action:none}
#top{grid-row:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:56px}
#pills{grid-row:2}#pad1{grid-row:3}#boardWrap{grid-row:4}#pad0{grid-row:5}
#mode{font-family:var(--display);font-size:14px;line-height:1.1;color:var(--muted)}
#scorebox{text-align:center;min-width:120px}
#time{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
#sub{font-size:13px;font-weight:500;color:var(--muted);margin-top:3px;min-height:16px;white-space:nowrap}
.iconbtn{justify-self:end;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.iconbtn svg{width:20px;height:20px}

#pills{display:flex;gap:6px;justify-content:center;margin:0 0 8px;min-height:32px;min-width:0;overflow:hidden}
.pill .wn{font-family:var(--display);font-size:15px;line-height:1;min-width:10px;text-align:center}
.pill{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:6px;padding:5px 9px 5px 6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);transition:opacity .25s}
.pill.dead{opacity:.42}
.pill .hd{flex:none;position:relative;width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.35)}
.pill .hd::after{content:"";position:absolute;left:5px;top:6px;width:10px;height:6px;border-radius:3px;background:#1D1533}
.pill.dead .hd::after{background:transparent;border-top:2px solid #1D1533;height:0;top:9px;transform:rotate(-12deg)}
.pill .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78px}
.pips{display:flex;gap:2px;flex:none}
.pips i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--c)}

#boardWrap{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#arena{position:relative;line-height:0}
#cv{display:block;border-radius:16px;box-shadow:0 0 0 3px var(--glow),0 12px 30px rgba(20,10,40,.28);transition:box-shadow .25s}
#fx{position:absolute;inset:0;pointer-events:none;z-index:2;line-height:normal}
.fxt{position:absolute;font-family:var(--display);color:#fff;font-size:17px;line-height:1.05;text-align:center;white-space:nowrap;
  text-shadow:0 2px 0 rgba(0,0,0,.45);animation:rise 1s ease-out both}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.06)}100%{opacity:0;transform:translate(-50%,-190%)}}
#count{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:3;text-align:center;
  font-family:var(--display);font-size:64px;line-height:1.05;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.4);padding:0 16px}
#count.on{display:flex}
#count.msg{font-size:30px}
#count small{display:block;font-family:var(--font);font-weight:700;font-size:15px;margin-top:8px;text-shadow:0 2px 0 rgba(0,0,0,.45)}
#toast{position:absolute;left:50%;top:6px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;z-index:45;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:500;font-size:15px;max-width:88vw;text-align:center;transition:opacity .2s,transform .2s;line-height:1.3}
#toast.on{opacity:1;transform:translate(-50%,0)}

.pad{height:var(--ph);display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding-top:10px;--pc:var(--k1)}
#pad1{display:none;padding-top:0;padding-bottom:10px;transform:rotate(180deg)}
#app.two #pad1{display:grid}
#app.two{--ph:clamp(104px,15vh,136px)}
.stick{position:relative;height:100%;border-radius:22px;background:var(--panel);border:1px solid var(--line);touch-action:none;overflow:hidden}
.base{position:absolute;left:50%;top:50%;height:min(112px,86%);width:auto;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg);border:2px solid var(--line);pointer-events:none}
.base b{position:absolute;width:0;height:0;border:7px solid transparent;opacity:.55}
.base .u{left:50%;top:6px;margin-left:-7px;border-bottom-color:var(--muted);border-top-width:0}
.base .d{left:50%;bottom:6px;margin-left:-7px;border-top-color:var(--muted);border-bottom-width:0}
.base .l{top:50%;left:6px;margin-top:-7px;border-right-color:var(--muted);border-left-width:0}
.base .r{top:50%;right:6px;margin-top:-7px;border-left-color:var(--muted);border-right-width:0}
.base[data-d="0"] .u{border-bottom-color:var(--pc);opacity:1}.base[data-d="2"] .d{border-top-color:var(--pc);opacity:1}
.base[data-d="3"] .l{border-right-color:var(--pc);opacity:1}.base[data-d="1"] .r{border-left-color:var(--pc);opacity:1}
.knob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;background:var(--pc);transform:translate(-50%,-50%);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),inset 0 4px 0 rgba(255,255,255,.35);transition:transform .1s ease-out}
.stick.on .knob{transition:none}
.hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
.stats{display:grid;gap:7px}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:15px;line-height:1;min-width:46px;color:var(--ink)}
.stat svg{width:18px;height:18px;flex:none}
.bombbtn{--bb:min(96px,calc(var(--ph) - 18px));width:var(--bb);height:var(--bb);border-radius:50%;border:0;padding:0;background:var(--pc);display:grid;place-items:center;touch-action:none;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),inset 0 4px 0 rgba(255,255,255,.35),0 8px 18px rgba(20,10,40,.25);transition:opacity .15s,transform .06s}
.bombbtn svg{width:46%;height:46%;color:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.bombbtn.off{opacity:.4}
.bombbtn.hit{transform:translateY(2px) scale(.96)}

#ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:var(--scrim);
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);touch-action:manipulation}
#ov.on{display:flex}
.panel{width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--panel);color:var(--ink);border-radius:24px;padding:22px 20px 18px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.panel h2{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.15;margin:0 0 6px}
.panel p{margin:6px 0;line-height:1.45}
.title{display:grid;gap:5px;margin:2px 0 10px}
.title div{display:flex;justify-content:center;gap:5px}
.title span{display:grid;place-items:center;width:38px;height:40px;border-radius:10px;font-family:var(--display);font-size:21px;color:#1D1533;background:var(--k5);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.24),inset 0 3px 0 rgba(255,255,255,.38)}
.title span.st{color:#fff;background:repeating-linear-gradient(135deg,#8A83A3 0 3px,#6C6586 3px 7px)}
.title span.ba{background:var(--k1)}.title span.bb{background:var(--k4)}
.title svg{width:24px;height:24px;color:#fff}
.tag{text-align:center;color:var(--muted)}
.btn{display:block;width:100%;min-height:52px;border-radius:15px;border:0;font-weight:700;font-size:17px;margin-top:10px;padding:0 14px}
.btn.pri{background:var(--k2);color:#1D1533;box-shadow:inset 0 -4px 0 rgba(0,0,0,.16)}
.btn.sec{background:transparent;border:2px solid var(--line)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500;min-height:44px}
.btn:active,.mode:active{transform:translateY(1px)}
.mode{display:block;width:100%;text-align:left;border:2px solid var(--line);background:transparent;border-radius:16px;padding:13px 15px;margin-top:10px}
.mode b{display:block;font-family:var(--display);font-weight:400;font-size:18px;margin-bottom:3px}
.mode span{display:block;color:var(--muted);font-size:14px;line-height:1.4}
div.mode{cursor:default}
.mode .lab{margin-top:10px}.mode .btn{margin-top:10px}
.chips{display:flex;gap:6px;margin-top:6px}
.chip{flex:1 1 0;min-width:0;min-height:42px;padding:0 2px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);font:600 14px var(--font);white-space:nowrap}
.chip.on{background:var(--k2);border-color:var(--k2);color:#1D1533}
.lab{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:12px}
.field{display:block;width:100%;min-height:50px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--ink);
  font:500 17px var(--font);padding:0 14px;margin-top:6px;-webkit-user-select:text;user-select:text}
.field.code{font-family:var(--display);font-size:26px;letter-spacing:.25em;text-align:center;text-transform:uppercase}
.or{text-align:center;color:var(--muted);font-size:14px;margin:18px 0 0}
.bigcode{font-family:var(--display);font-size:54px;letter-spacing:.14em;text-align:center;margin:6px 0 2px;-webkit-user-select:text;user-select:text}
.status{font-weight:500}
.status.wait::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--k3);margin-left:8px;vertical-align:1px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.fine{font-size:13px;color:var(--muted)}
.rows{margin:10px 0 4px;border-top:1px solid var(--line)}
.rows div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px}
.rows span{display:flex;align-items:center;gap:8px;min-width:0}
.rows span i{flex:none;width:12px;height:12px;border-radius:4px;background:var(--c)}
.rows b{font-family:var(--display);font-weight:400;font-size:20px}
.rules p b{font-weight:700}
.items{display:grid;gap:8px;margin:10px 0}
.items div{display:flex;gap:10px;align-items:center;font-size:15px;line-height:1.35}
.items em{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:9px;font-style:normal;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.35)}
.items em svg{width:20px;height:20px;color:#fff}
textarea.field{min-height:220px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace}
@media (prefers-reduced-motion:reduce){.fxt{animation-duration:.01s}.status.wait::after{animation:none}.knob{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="mode">Bommenduel</div>
    <div id="scorebox"><div id="time">2:00</div><div id="sub"></div></div>
    <button class="iconbtn" data-a="menu" aria-label="Menu"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="2" y="4" width="16" height="2.4" rx="1.2"/><rect x="2" y="9" width="16" height="2.4" rx="1.2"/><rect x="2" y="14" width="16" height="2.4" rx="1.2"/></svg></button>
  </header>
  <section id="pills" aria-label="Spelers"></section>
  <section id="pad1" class="pad" aria-label="Besturing speler 2">
    <div class="stick" data-p="1"><div class="base"><b class="u"></b><b class="r"></b><b class="d"></b><b class="l"></b><div class="knob"></div></div></div>
    <div class="stats" id="stats1"></div>
    <button class="bombbtn" data-p="1" aria-label="Bom leggen speler 2"></button>
  </section>
  <main id="boardWrap"><div id="arena"><canvas id="cv" aria-label="Speelveld"></canvas><div id="fx"></div></div><div id="count"></div><div id="toast" role="status" aria-live="polite"></div></main>
  <footer id="pad0" class="pad" aria-label="Besturing">
    <div class="stick" data-p="0"><div class="base"><b class="u"></b><b class="r"></b><b class="d"></b><b class="l"></b><div class="knob"></div></div></div>
    <div class="stats" id="stats0"></div>
    <button class="bombbtn" data-p="0" aria-label="Bom leggen"></button>
  </footer>
</div>
<div id="ov" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>

<script>
(() => {
'use strict';
const VERSION = '1.0.0';
const APP = 'bm1';
const PEER_PREFIX = 'bommenduel-v1-';
const $ = s => document.querySelector(s);
const T0 = performance.now();
const params = new URLSearchParams(location.search);
const TEST = params.has('test');
const TF = TEST ? Math.max(0.1, +(params.get('tf') || 1)) : 1;
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
const FORCE_BC = params.get('net') === 'bc';
const ls = {
  get(k, d) { try { const v = localStorage.getItem('bommenduel.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('bommenduel.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('bommenduel.' + k); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const hx2 = n => n.toString(16).padStart(2, '0');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------------- LOG van de laatste run ---------------- */
const Log = (() => {
  const d = { run: Math.random().toString(36).slice(2, 8), version: VERSION, started: new Date().toISOString(),
    env: FORCE_BC ? 'test-broadcast' : IN_CLAUDE ? 'claude-artifact' : 'web', ua: navigator.userAgent.slice(0, 180),
    screen: `${screen.width}x${screen.height} dpr${window.devicePixelRatio || 1} venster${innerWidth}x${innerHeight}`, errors: 0, entries: [] };
  let dirty = true, db = null, uid = null, busy = false;
  function add(kind, msg) {
    const t = ((performance.now() - T0) / 1000).toFixed(1).padStart(6, ' ');
    d.entries.push(`${t}s ${kind.padEnd(4)} ${String(msg).replace(/[\u0000-\u001f\u007f]/g, ' ').slice(0, 240)}`);
    if (d.entries.length > 400) d.entries.splice(0, d.entries.length - 400);
    if (kind === 'err') { d.errors++; setTimeout(flush, 100); }
    dirty = true;
  }
  async function flush() {
    if (!dirty) return;
    dirty = false; d.saved = new Date().toISOString();
    ls.set('lastlog', d);
    if (db && uid && !busy) {
      busy = true;
      try { await db.doc(`data/users/${uid}/runlog`).set(JSON.parse(JSON.stringify(d))); }
      catch (e) { const c = e && e.code; if (c === 'invalid_argument' || c === 'revoked' || c === 'not_granted') { db = null; add('info', 'online log-opslag uit: ' + c); } else dirty = true; }
      busy = false;
    }
  }
  const text = () => [`Bommenduel log  run=${d.run}  v${d.version}  omgeving=${d.env}`, `start ${d.started}`, `toestel ${d.ua}`, `scherm ${d.screen}`, `fouten ${d.errors}`, '', ...d.entries].join('\n');
  setInterval(flush, 3000);
  document.addEventListener('visibilitychange', () => { add('info', document.visibilityState === 'hidden' ? 'app naar achtergrond' : 'app weer zichtbaar'); if (document.visibilityState === 'hidden') flush(); });
  addEventListener('pagehide', () => { dirty = true; flush(); });
  return { add, flush, text, data: d, attach(ns, id) { db = ns; uid = id; dirty = true; flush(); } };
})();
addEventListener('error', e => Log.add('err', `${e.message || 'fout'} @${String(e.filename || '').split('/').pop()}:${e.lineno || 0}`));
addEventListener('unhandledrejection', e => { const r = e.reason; Log.add('err', 'promise: ' + (r ? (r.code ? r.code + ' ' : '') + (r.message || r.type || String(r)) : '?')); });
Log.add('info', `start v${VERSION} omgeving=${FORCE_BC ? 'test' : IN_CLAUDE ? 'claude' : 'web'}`);

let roomP = Promise.resolve(null);
if (IN_CLAUDE && !FORCE_BC) {
  roomP = window.claude.use('room').catch(() => null);
  roomP.then(r => Log.add('net', 'realtime kamer ' + (r ? 'beschikbaar' : 'niet beschikbaar')));
  (async () => {
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) { Log.add('info', 'db/user niet beschikbaar: log alleen lokaal'); return; }
      const id = await user.id();
      if (!id) { Log.add('info', 'geen gebruikers-id: log alleen lokaal'); return; }
      try {
        const prev = await db.doc(`data/users/${id}/runlog`).get();
        if (prev.exists) await db.doc(`data/users/${id}/runlog_prev`).set(JSON.parse(JSON.stringify(prev.data())));
      } catch (e) { Log.add('info', 'vorige log niet bewaard: ' + (e && e.code)); }
      Log.attach(db, id); Log.add('info', 'log wordt online bewaard');
    } catch (e) { Log.add('err', 'log-opslag: ' + (e && (e.code || e.message))); }
  })();
}

/* ---------------- REGELS & ARENA ---------------- */
const W = 11, H = 13, NC = W * H;
const FUSE = 2400, FLAME = 550, BASE_SPEED = 3.1, SPEED_STEP = 0.5, MAX_SP = 4, MAX_BM = 8, MAX_RG = 8;
const ROUND_MS = 120000, HURRY_MS = 45000, COUNT_MS = 3000, END_MS = 2600, GRACE_MS = 900;
const COLORS = ['#FF6B5B', '#4FB3FF', '#3DDC97', '#FFC23D'];
const COLOR_NL = ['Rood', 'Blauw', 'Groen', 'Geel'];
const SPAWN = [[0, H - 1], [W - 1, 0], [0, 0], [W - 1, H - 1]];
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const ITEM_COL = { b: '#FF7AC6', f: '#FF9447', s: '#4FE3E0' };
const ITEM_TXT = { b: 'Bom +1', f: 'Vuur +1', s: 'Sneller' };
const cellOf = p => Math.round(p.y) * W + Math.round(p.x);
const isHardXY = (x, y) => (x & 1) === 1 && (y & 1) === 1;

class RNG {
  constructor(s) { this.a = s >>> 0; }
  next() { let t = (this.a = (this.a + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
}
function genMap(seed) {
  const R = new RNG(seed), grid = new Uint8Array(NC), hidden = new Array(NC).fill('');
  const safe = new Set();
  for (const [sx, sy] of SPAWN) for (const [dx, dy] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {

  openOv(host ? `<h2>Jouw spelcode</h2><div class="bigcode">${esc(Net.code)}</div>
      <p>Laat de ander op <b>Doe mee</b> tikken en deze code invullen.</p>
      ${canShare ? '<button class="btn sec" data-a="share">Deel uitnodiging</button>' : ''}
      <p class="status wait" id="netStatus">Wachten op tegenstander</p>
      <button class="btn ghost" data-a="online">Annuleren</button>`
    : `<h2>Meedoen</h2><div class="bigcode">${esc(Net.code)}</div>
      <p class="status wait" id="netStatus">Verbinden</p>
      <button class="btn ghost" data-a="online">Annuleren</button>`, 'wait');
}
function showNetError(type) {
  const msg = {
    'peer-unavailable': `Geen spel gevonden met code ${Net.code}. Controleer de code, of laat de ander opnieuw een spel maken.`,
    'room-null': 'Online spelen werkt hier alleen als je bent ingelogd bij Claude.',
    'network': 'Geen verbinding met de server. Controleer je internet en probeer opnieuw.',
    'server-error': 'De verbindingsserver reageert niet. Probeer het over een minuut opnieuw.',
    'browser-incompatible': 'Deze browser ondersteunt geen directe verbinding. Gebruik Safari of Chrome.',
    'load': 'Het netwerkonderdeel kon niet laden. Controleer je internet.',
    'lost': `De verbinding met ${oppNick()} is weg.`
  }[type] || 'Verbinden lukte niet. Probeer het opnieuw.';
  const code = Net.code, role = Net.role;
  leaveOnline();
  openOv(`<h2>Geen verbinding</h2><p>${esc(msg)}</p>
    ${type !== 'room-null' ? `<button class="btn pri" data-a="${role === 'h' ? 'host' : 'rejoin'}" data-code="${esc(code)}">Opnieuw proberen</button>` : ''}
    <button class="btn ghost" data-a="home">Naar start</button>`, 'neterr');
}
const MODE_DESC = { duel: ['Duel', 'Jullie tweeën, één tegen één.'], chaos: ['Chaos', 'Met twee slimme computers erbij. Ieder voor zich.'] };
function showLobby() {
  const host = Net.role === 'h';
  const modes = Object.entries(MODE_DESC).map(([k, [t, d]]) => host
    ? `<div class="mode"><b>${t}</b><span>${d}</span><p class="lab">Rondes nodig om te winnen</p>${chipsHTML('wins.' + k)}<button class="btn pri" data-a="start" data-mode="${k}">Start ${t.toLowerCase()}</button></div>`
    : `<div class="mode"><b>${t}</b><span>${d}</span></div>`).join('');
  openOv(`<h2>Verbonden met <span id="oppN"></span></h2>
    <p class="fine" id="rtt">Reactietijd meten…</p>
    ${host ? '<p>Kies de spelvorm:</p>' : '<p class="status wait" id="netStatus"></p>'}
    ${modes}
    <button class="btn ghost" data-a="home">Stoppen</button>`, 'lobby');
  updateLobby();
}
function updateLobby() {
  const n = $('#oppN'); if (n) n.textContent = oppNick();
  const r = $('#rtt'); if (r && Net.rtt) r.textContent = `Reactietijd ${Net.rtt} ms${Net.rtt < 120 ? ', lekker snel' : Net.rtt < 300 ? ', prima' : ', wat traag voor een actiespel'}`;
  if (Net.role === 'g') setStatus(`${oppNick()} kiest de spelvorm`);
}
function showMatchResult(r) {
  clearToast();
  const v = r.v;
  let title, rows = '', btns = '';
  if (r.mode === 'online' && Net.role === 'h') Net.set({ live: 0 });
  if (r.gone) title = 'Verbinding verbroken';
  else {
    const w = r.winner;
    title = G && G.mine.length === 2 ? `${nameOf(v, w)} wint!` : isMine(w) ? 'Jij wint!' : `${nameOf(v, w)} wint`;
    (isMine(w) || (G && G.mine.length === 2 && isMine(w))) ? sfx.win() : sfx.lose();
    rows = v.P.slice().sort((a, b) => b.wins - a.wins || a.idx - b.idx)
      .map(p => `<div style="--c:${COLORS[p.col]}"><span><i></i>${esc(p.name)}</span><b>${p.wins}</b></div>`).join('');
  }
  if (r.mode === 'bot' || r.mode === 'local') btns = `<button class="btn pri" data-a="again">Nog een keer</button><button class="btn ghost" data-a="home">Naar start</button>`;
  else if (r.gone || !Net.connected) btns = '<button class="btn pri" data-a="online">Nieuw online spel</button><button class="btn ghost" data-a="home">Naar start</button>';
  else if (Net.role === 'h') btns = `<button class="btn pri" data-a="start" data-mode="${v.P.length > 2 ? 'chaos' : 'duel'}">Nog een keer</button><button class="btn sec" data-a="lobby">Andere spelvorm</button><button class="btn ghost" data-a="home">Stoppen</button>`;
  else btns = `<p class="status wait" id="netStatus">Wachten tot ${esc(oppNick())} een nieuw spel start</p><button class="btn ghost" data-a="home">Stoppen</button>`;
  openOv(`<h2>${esc(title)}</h2>${rows ? `<p class="fine">Gewonnen rondes</p><div class="rows">${rows}</div>` : ''}${btns}`, 'result');
}
function showMenu() {
  const online = !!Net.role, local = G && (G.kind === 'bot' || G.kind === 'local');
  if (local) G.paused = true;
  openOv(`<h2>${local ? 'Pauze' : 'Menu'}</h2>
    <button class="btn pri" data-a="resume">Verder spelen</button>
    ${local ? '<button class="btn sec" data-a="again">Opnieuw beginnen</button>' : ''}
    <button class="btn sec" data-a="sound">Geluid: ${soundOn ? 'aan' : 'uit'}</button>
    <button class="btn sec" data-a="rulesm">Hoe werkt het?</button>
    <button class="btn sec" data-a="copylog">Kopieer log</button>
    <button class="btn ghost" data-a="home">${online ? 'Stoppen en naar start' : 'Naar start'}</button>
    <p class="fine" style="margin-top:12px">${online ? 'Een online spel loopt door terwijl dit menu open is. ' : ''}${IN_CLAUDE ? 'Tip: zeg "log" tegen Claude, dan leest die de log van deze run.' : 'Tip: plak de log in je chat met Claude als er iets misgaat.'} Versie ${VERSION}.</p>`, 'menu');
}
async function copyLog() {
  await Log.flush();
  const txt = Log.text();
  try { await navigator.clipboard.writeText(txt); toast('Log gekopieerd'); }
  catch (e) { openOv(`<h2>Log</h2><p class="fine">Selecteer alles en kopieer.</p><textarea class="field" readonly>${esc(txt)}</textarea><button class="btn ghost" data-a="menu">Terug</button>`, 'menu'); }
}

const ACT = {
  bot: () => showBotSetup(),
  botgo: el => startLocal({ kind: 'bot', bots: getOpt('bots'), level: +el.dataset.level === 1 ? 1 : 0, wins: getOpt('wins.bot') }),
  local: () => showLocalSetup(),
  localgo: () => startLocal({ kind: 'local', bots: getOpt('lbots'), level: 1, wins: getOpt('wins.local') }),
  again: () => { if (lastLocal) startLocal(lastLocal); else showHome(); },
  opt: el => {
    ls.set('opt.' + el.dataset.k, +el.dataset.v);
    el.parentElement.querySelectorAll('.chip').forEach(c => { const on = c === el; c.classList.toggle('on', on); c.setAttribute('aria-pressed', String(on)); });
  },
  rules: () => showRules('home'),
  rulesm: () => showRules('menu'),
  online: () => showOnline(),
  home: () => showHome(),
  host: el => goOnline('h', cleanCode(el && el.dataset.code).length === 4 ? cleanCode(el.dataset.code) : newCode()),
  join: () => { const c = cleanCode($('#code') && $('#code').value); if (c.length !== 4) { toast('Vul de 4 letters van de code in'); return; } goOnline('g', c); },
  rejoin: el => goOnline('g', el.dataset.code),
  start: el => { if (Net.role === 'h' && Net.connected) hostStart(el.dataset.mode === 'chaos' ? 'chaos' : 'duel'); else toast('Nog niet verbonden'); },
  lobby: () => showLobby(),
  menu: () => showMenu(),
  resume: () => { if (G) { G.paused = false; closeOv(); ui = 'game'; } else showHome(); },
  sound: () => { soundOn = !soundOn; ls.set('sound', soundOn); if (soundOn) sfx.place(); showMenu(); },
  copylog: () => copyLog(),
  share: async () => {
    const url = location.origin + location.pathname + '?join=' + Net.code;
    const text = `Speel Bommenduel tegen me! Code: ${Net.code}`;
    try { if (navigator.share) { await navigator.share({ title: 'Bommenduel', text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text + ' ' + url); toast('Uitnodiging gekopieerd'); } catch (e) { toast('Code: ' + Net.code); }
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = ACT[el.dataset.a]; if (f) { audio(); f(el); }
});
function onEnter(t) { if (t.id === 'code') ACT.join(); else if (t.id === 'nick' && ui === 'online') t.blur(); }
document.addEventListener('input', e => { if (e.target.id === 'code') { const v = cleanCode(e.target.value); if (v !== e.target.value) e.target.value = v; } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && G && (G.kind === 'bot' || G.kind === 'local') && ui === 'game') showMenu();
});

/* ---------------- LUS ---------------- */
const IDLE = (() => {
  const m = genMap(20260926);
  return { grid: m.grid, items: new Array(NC).fill(''), bombs: [], flame: new Float32Array(NC), fmask: new Uint8Array(NC), P: [], drops: [], phase: 'x', bombAt: () => null };
})();
let lastT = performance.now(), hitches = 0, frames = 0, fpsT = performance.now();
const loopErr = new Set();
function reportLoop(e) { const m = (e && e.message) || String(e); if (!loopErr.has(m)) { loopErr.add(m); Log.add('err', 'spellus: ' + m + ' ' + String(e && e.stack || '').split('\n')[1]); } }
function frame(now) {
  let dt = now - lastT; lastT = now;
  if (G && ui === 'game' && dt > 160 && document.visibilityState === 'visible') { hitches++; if (hitches <= 15) Log.add('perf', `haperend beeld: ${Math.round(dt)}ms`); }
  frames++;
  if (now - fpsT > 30000) { if (G && ui === 'game') Log.add('perf', `beeld ${Math.round(frames * 1000 / (now - fpsT))} fps`); frames = 0; fpsT = now; }
  dt = Math.min(dt, 50) * TF;
  if (G) { try { G.update(dt); } catch (e) { reportLoop(e); } }
  PADS[0].bomb = PADS[1].bomb = false;
  try { draw(G ? G.view() : IDLE, now); } catch (e) { reportLoop(e); }
  renderCount(now);
  requestAnimationFrame(frame);
}
setInterval(() => { if (G && G.tick) G.tick(); renderAll(); }, 200);

/* ---------------- START ---------------- */
layout(); renderAll();
Log.add('info', `vakje ${CS}px, venster ${innerWidth}x${innerHeight}`);
requestAnimationFrame(frame);
const joinCode = cleanCode(params.get('join'));
if (joinCode.length === 4) { showOnline(joinCode); if (ls.get('nick', '')) setTimeout(() => goOnline('g', joinCode), 150); }
else showHome();

if (TEST) window.__bm = { get G() { return G; }, Net, Log, PADS, W, H, get ui() { return ui; }, startLocal, cellOf, dangerMap };
})();
</script>
</body>
</html>
